services:
  backend:
    build: ./backend
    # Default docker bridge has egress to grft.dev (needed to publish the graft).
    # Compose-project networks in some environments have no outbound HTTPS.
    network_mode: bridge
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/usr/app/data
    environment:
      - DATABASE_PATH=/usr/app/data/todos.sqlite

  frontend:
    build: ./frontend
    network_mode: bridge
    ports:
      - "5173:5173"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_GRAFT_HOST=ws://localhost:8000/ws
      - GRAFT_NPM_URL=http://host.docker.internal:8000/npm
    depends_on:
      - backend

volumes:
  sqlite_data:
