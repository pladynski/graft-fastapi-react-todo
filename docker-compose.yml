services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - sqlite_data:/usr/app/data
    environment:
      - DATABASE_PATH=/usr/app/data/todos.sqlite

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_GRAFT_HOST=ws://localhost:8000/ws
      - GRAFT_NPM_URL=http://backend:8000/npm
    depends_on:
      - backend

volumes:
  sqlite_data:
