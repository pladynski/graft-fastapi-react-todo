version: '3.8'

services:
  backend:
    build: ./backend
    network_mode: bridge
    ports:
      - '8000:8000'
    volumes:
      - sqlite_data:/app/data
    environment:
      - DATABASE_PATH=/app/data/todos.sqlite

  frontend:
    build: ./frontend
    network_mode: bridge
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - '5173:5173'
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_GRAFT_HOST=ws://localhost:8000/ws
      - GRAFT_NPM_URL=http://host.docker.internal:8000/npm
    depends_on:
      - backend

volumes:
  sqlite_data:
